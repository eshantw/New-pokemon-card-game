<!DOCTYPE html>
<html lang="zh-TW">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Pokémon TCG Pro: Quiz Battle - Ultra Edition</title>
 <style>
 :root{
   --team1-color:#2a75bb;--team2-color:#e3350d;
   --color-fire:#ff9d55;--color-water:#5090d6;--color-grass:#63bc5a;--color-electric:#f4d23c;--color-normal:#9d9e9d;--color-brown:#a0522d;--color-purple:#9b59b6;--color-any:#eeeeee;
   --art-bg-grass: radial-gradient(circle at 50% 30%, #204829 0%, #0d1e11 100%);
   --art-bg-fire: radial-gradient(circle at 50% 30%, #582414 0%, #240c06 100%);
   --art-bg-water: radial-gradient(circle at 50% 30%, #163c66 0%, #091728 100%);
   --art-bg-electric: radial-gradient(circle at 50% 30%, #5c5016 0%, #252008 100%);
   --art-bg-purple: radial-gradient(circle at 50% 30%, #441957 0%, #1c0924 100%);
   --art-bg-brown: radial-gradient(circle at 50% 30%, #482718 0%, #1d0f09 100%);
   --art-bg-normal: radial-gradient(circle at 50% 30%, #3e4046 0%, #1a1b1e 100%);
 }
 *{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans TC',Arial,sans-serif;user-select:none}
 
 body{background:#0b0d14;color:#fff;width:100vw;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
 #fx-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9999}
 #screen-flash{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#fff;opacity:0;pointer-events:none;z-index:9998;transition:opacity 0.05s ease-out;}

 #lobby{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;z-index:20;background:radial-gradient(circle at 50% 40%, #151928 0%, #08090e 100%);position:absolute;width:100%;height:100%;overflow-y:auto;}
 .config-box{position:relative; z-index:10; background:rgba(18, 20, 30, 0.85); backdrop-filter:blur(15px); padding:30px;border-radius:24px;border:2px solid #ffcb05;width:100%;max-width:850px;text-align:center;box-shadow:0 0 30px rgba(0,0,0,.8); margin: auto; transform-origin: center center;}
 
 .upload-section { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; margin: 10px 0; border: 2px dashed #444; text-align: left; display: flex; flex-direction: column; min-height: 220px;}
 .mode-c { min-height: auto !important; padding: 15px !important; margin-top: 15px !important; }
 .cloud-input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #444; background: #000; color: #77cc55; font-size: 13px; outline:none; }
 .cloud-input:focus { border-color: #ffcb05; }
 #qInput { width: 100%; flex: 1; min-height: 50px; margin-bottom: 10px; padding: 12px; border-radius: 8px; font-size: 14px; background: #000; color: #fff; border: 1px solid #444; resize: none;}

 .lobby-mascot { position: fixed; bottom: 5%; width: 260px; max-width: 25vw; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8)); animation: bounce 1.8s infinite alternate ease-in-out; pointer-events: none; z-index: 9999;}
 .mascot-left { left: 3%; }
 .mascot-right { right: 3%; animation-delay: 0.9s; }
 @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-18px); } }
 
 .start-btn-content { display: flex; align-items: center; justify-content: center; gap: 12px; }
 .pokeball-icon { width: 28px; height: 28px; }

 #battle-field { 
   position: relative; width: 100vw; height: 100vh; 
   background: radial-gradient(circle at 50% 50%, #161c2e 0%, #0a0d17 60%, #05060a 100%); 
   overflow: hidden; 
 }
 #battle-field::before {
   content: ''; position: absolute; top: 50%; left: 50%; width: 650px; height: 650px;
   transform: translate(-50%, -50%); border-radius: 50%;
   border: 8px solid rgba(255, 255, 255, 0.025); pointer-events: none;
   box-shadow: inset 0 0 100px rgba(0, 242, 255, 0.02); z-index: 1;
 }
 #battle-field::after {
   content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px;
   background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.03) 50%, transparent 100%);
   pointer-events: none; z-index: 1;
 }

 #battle-scale-wrapper { width: 1280px; height: 720px; position: absolute; left: 50%; top: 50%; display: flex; flex-direction: column; z-index: 2; }
 
 .battle-main { flex:1; display:flex; justify-content:space-between; align-items:stretch; padding:20px 10px; gap:15px; height: 100%; max-height: 100%; box-sizing: border-box; overflow: hidden; }
 .team-container { width:510px; display:flex; flex-direction:column; justify-content:space-between; gap:10px; padding:20px 15px; border-radius:25px; background:rgba(15, 18, 28, 0.55); backdrop-filter: blur(12px); border:2px solid rgba(255,255,255,0.06); transition:.3s; height: 100%; max-height: 100%; box-sizing: border-box; overflow: hidden;}
 .team-container.active-team{border-color:#00f2ff;background:linear-gradient(180deg,rgba(0,242,255,.08) 0,rgba(0,100,255,.18) 100%);box-shadow:0 0 30px rgba(0,242,255,.5),inset 0 0 15px rgba(0,150,255,.3);}
 
 .field-area { display:flex; gap:15px; align-items:center; justify-content:center; flex: 1; min-height: 0; perspective: 1000px;}
 .bench-grid { display:grid; grid-template-columns:repeat(2,120px); grid-template-rows:repeat(2,auto); gap:10px; justify-content:center; }
 .active-zone { flex:0 0 auto; display:flex; justify-content:center; align-items:center; padding:6px; border:2px dashed #444; border-radius:12px; margin: 0 5px; }
 
 .hand-wrapper { position: relative; width: 100%; margin-top: auto; flex-shrink: 0; perspective: 1000px; }
 .hand-tooltip { position: absolute; bottom: 100%; margin-bottom: 5px; left: 50%; transform: translateX(-50%); width: 95%; background: rgba(20, 20, 20, 0.9); color: #ffcb05; padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; text-align: center; border: 2px solid #ffcb05; z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.2s ease-in-out; box-shadow: 0 5px 15px rgba(0,0,0,0.7); line-height: 1.4; }
 .hand-tooltip.show { opacity: 1; }
 
 .hand-area{height:110px; background:rgba(0,0,0,.6); border-radius:12px; padding:8px; display:flex; flex-wrap:nowrap; gap:8px; align-items:center; justify-content:center; overflow:hidden;}
 .hand-card{position:relative; flex: 1 1 0; max-width:65px; min-width:35px; height:95px; border-radius:8px; padding:4px; cursor:pointer; text-align:center; font-size:12px; font-weight:700; border:2px solid #fff; transition:.2s; box-shadow:0 4px 8px rgba(0,0,0,.5); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1}
 .hand-card:hover{transform:translateY(-8px) scale(1.1);filter:brightness(1.2);z-index:50;}
 .hand-card.selected{border-color:#0f0;transform:translateY(-10px);box-shadow:0 0 15px rgba(0,255,0,.5)}
 .hand-energy{background:#333}
 .hand-trainer{background:linear-gradient(135deg,#eee,#aaa);color:#222}

 .center-panel{width:210px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:20px 10px; gap:10px; align-self: stretch; height: 100%; max-height: 100%; box-sizing: border-box; overflow: hidden; }
 #action-hint { color: #bbb; font-size: 13px; text-align: center; margin-bottom: 8px; min-height: 35px; line-height:1.4; flex-shrink: 0; }
 #log{flex:1; width:100%; background:rgba(0,0,0,.7); border:1px solid #333; border-radius:8px; padding:10px; font-size:14px; color:#eee; overflow-y:auto; display:flex; flex-direction:column; gap:8px; height: 0;}
 .log-entry{border-bottom:1px solid #222; padding-bottom:5px; animation:slideIn .3s ease-out; opacity:1 !important; line-height:1.4;}
 @keyframes slideIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}

 .card {
   flex-shrink:0; background:#fff; border-radius:8px; color:#222; padding:6px; font-size:12px;
   position:relative; border:3px solid transparent; box-shadow:0 6px 12px rgba(0,0,0,.5);
   display:flex; flex-direction:column; overflow:hidden; transform-style: preserve-3d;
   transition: transform 0.12s ease-out, box-shadow 0.2s ease, border-color 0.2s ease;
 }
 .card::before {
   content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 15;
   border-radius: inherit; opacity: 0; transition: opacity 0.2s ease;
   background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.1) 35%, transparent 70%);
   mix-blend-mode: overlay;
 }
 .card:hover::before { opacity: 1; }

 .card-active{width:180px; transform: scale(1.05);}
 .card-active .card-img{height:90px}
 .card-bench{width:120px}
 .card-bench .card-img{height:70px}
 .card-bench .attack-row{padding:3px;font-size:10px;margin-top:3px}
 
 .card.type-fire{background:var(--color-fire)}
 .card.type-water{background:var(--color-water)}
 .card.type-grass{background:var(--color-grass)}
 .card.type-electric{background:var(--color-electric)}
 .card.type-normal{background:var(--color-normal)}
 .card.type-brown{background:var(--color-brown)}
 .card.type-purple{background:var(--color-purple)}

 .card:hover{z-index:5}
 .card.is-active-fighter{border-color:gold;box-shadow:0 0 20px rgba(255,215,0,.6); z-index:10;}
 .card.dead{filter:grayscale(100%);opacity:.5;pointer-events:none;}
 .card.dead.revivable{pointer-events:auto;animation:pulse 1.5s infinite;border-color:#0f0;opacity:.8;filter:grayscale(30%)}
 .card.valid-target{border-color:#0f0;box-shadow:0 0 15px #0f0;animation:pulse 1.5s infinite}
 .card.mega-target{border-color:#ff00ff;box-shadow:0 0 25px #ff00ff;animation:megaPulse 1.5s infinite; z-index:20;}
 .card.gmax-target{border-color:#ffd700;box-shadow:0 0 25px #ffd700;animation:gmaxPulse 1.5s infinite; z-index:20;}
 @keyframes megaPulse{0%,100%{box-shadow:0 0 10px #ff00ff}50%{box-shadow:0 0 35px #ff00ff;border-color:#fff}}
 @keyframes gmaxPulse{0%,100%{box-shadow:0 0 10px #ffd700}50%{box-shadow:0 0 35px #ffd700;border-color:#fff}}
 @keyframes pulse{0%,100%{box-shadow:0 0 5px #0f0}50%{box-shadow:0 0 20px #0f0}100%{box-shadow:0 0 5px #0f0}}

 .active-header { display:flex; justify-content:space-between; align-items:center; margin-left:20px; font-weight:900; margin-bottom:4px; font-size:14px;}
 .bench-header { display:flex; flex-direction:column; align-items:flex-start; margin-left:18px; font-weight:900; margin-bottom:4px; line-height:1.2; }
 .bench-header .name-text { font-size:12px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
 .bench-header .hp-text { font-size:11px; font-weight:900; }
 
 .card-img{
   width:100%; border-radius:4px; display:flex; align-items:center; justify-content:center;
   overflow:hidden; border:2px solid #222; position:relative; box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
 }
 .card-img.art-bg-grass { background: var(--art-bg-grass); }
 .card-img.art-bg-fire { background: var(--art-bg-fire); }
 .card-img.art-bg-water { background: var(--art-bg-water); }
 .card-img.art-bg-electric { background: var(--art-bg-electric); }
 .card-img.art-bg-purple { background: var(--art-bg-purple); }
 .card-img.art-bg-brown { background: var(--art-bg-brown); }
 .card-img.art-bg-normal { background: var(--art-bg-normal); }

 .card-img::before {
   content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
   background-image: 
     radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
     radial-gradient(1.5px 1.5px at 70px 60px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
     radial-gradient(1px 1px at 120px 25px, rgba(255,255,255,0.6), rgba(0,0,0,0)),
     radial-gradient(1.5px 1.5px at 150px 75px, #fff, rgba(0,0,0,0));
   background-repeat: repeat; background-size: 160px 100px; opacity: 0.6;
   animation: cosmicDrift 25s linear infinite; pointer-events: none; z-index: 1;
 }
 @keyframes cosmicDrift { 0% { transform: translateY(0); } 100% { transform: translateY(-100px); } }

 .card-img img{max-width:90%;max-height:90%;object-fit:contain;image-rendering:-webkit-optimize-contrast;position:relative;z-index:2;}
 .inspect-btn{position:absolute;top:-5px;left:-5px;background:rgba(0,0,0,.8);color:white;border-radius:50%;width:24px;height:24px;display:flex;justify-content:center;align-items:center;z-index:20;border:1px solid #fff;font-size:12px;}
 .inspect-btn:hover{transform:scale(1.2);background:#ffcb05;color:black}
 
 /* 🌟 黃色圈選處 Buff 標籤容器，自適應字級與換行 */
 .buff-container{position:absolute;top:4px;right:4px;display:flex;gap:3px;flex-direction:column;align-items:flex-end;z-index:5;max-width:70%;}
 .item-tag{
   background:#ffcb05;color:black;padding:2px 4px;border-radius:5px;
   font-size:8.5px;font-weight:900;box-shadow:0 2px 4px rgba(0,0,0,.5);
   border:1px solid #000;white-space:normal;line-height:1.15;word-break:break-all;text-align:right;
 }
 .status-container-img { position: absolute; top: 4px; left: 4px; display: flex; gap: 3px; flex-direction: column; align-items: flex-start; z-index: 5; }
 .status-tag{padding:3px 5px;border-radius:4px;font-size:9px;font-weight:bold;color:white;border:1px solid rgba(255,255,255,.5);box-shadow:0 2px 4px rgba(0,0,0,.5);}
 
 .status-poison{background-color:#904090} .status-paralyze{background-color:#f4d23c;color:#000} .status-burn{background-color:#f40} .status-asleep{background-color:#555} .status-confused{background-color:#f90} .status-cant-act{background-color:#555555} .status-immune{background-color:#00a8ff} 

 .energy-container{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;min-height:14px;background:rgba(255,255,255,.3);border-radius:4px;padding:2px}
 .energy-icon{width:12px;height:12px;border-radius:50%;border:1px solid #000;display:inline-block;}
 .energy-fire{background:var(--color-fire)} .energy-water{background:var(--color-water)} .energy-grass{background:var(--color-grass)} .energy-electric{background:var(--color-electric)} .energy-normal{background:var(--color-normal)} .energy-brown{background:var(--color-brown)} .energy-purple{background:var(--color-purple)} .energy-any{background:var(--color-any)} .energy-rainbow{background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red)}
 
 .attack-row { margin-top: 4px; padding: 4px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; border: 1px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.1); color: #222;}
 .attack-ready { background: rgba(255,255,255,0.95) !important; opacity: 1; box-shadow: 0 0 5px rgba(255,255,255,0.6); }
 .attack-ready:hover { transform: scale(1.02); background: #fff !important; }
 .attack-disabled { background: rgba(255,255,255,0.3) !important; opacity: 1; cursor: not-allowed; }
 .attack-disabled span { color: #333; } 
 .attack-special-icon { font-size: 9px; margin-left: 2px; color: #555; }
 
 .bench-attack-preview { margin-top:4px; display:flex; flex-direction:column; gap:3px; align-items:flex-start; background:rgba(255,255,255,0.1); border-radius:4px; padding:4px; }
 .bench-attack-preview > div { display:flex; gap:2px; justify-content:flex-start; }

 .hp-bar{height:6px;background:#333;border-radius:3px;margin:3px 0;overflow:hidden;border:1px solid #000}
 .hp-fill{height:100%;background:#4caf50;transition:width .3s}

 .game-modal{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10000; border-radius: 20px;}
 .modal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20000}
 .modal-box{background:#1a1a1a;padding:30px;border-radius:20px;max-width:1000px;width:95%;text-align:center;border:2px solid #ffcb05;position:relative}
 .btn{padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;border:none;font-size:14px;transition:.3s;width:100%;display:block;margin-bottom:8px;}
 .btn:not(:disabled):hover{filter:brightness(1.3);transform:translateY(-2px)}
 #setup-ui { display: flex; flex-direction: column; width: 100%; gap: 5px; margin-bottom: 10px; }

 .kahoot-btn { padding: 20px 30px; border-radius: 16px; border: none; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; min-height: 130px; flex: 1 1 calc(50% - 30px); display: flex; align-items: center;}
 .kb-red { background-color: #e21b3c; } .kb-blue { background-color: #1368ce; } .kb-yellow { background-color: #d89e00; } .kb-green { background-color: #26890c; }

 #inspect-content .card{width:320px;font-size:16px;padding:15px;cursor:default;}
 #inspect-content .card-img{height:160px}
 #inspect-content .energy-icon{width:20px;height:20px}
 #inspect-content .attack-row{font-size:16px;padding:12px;margin-top:10px;}
 
 .hidden{display:none!important}

 .damage-pop{
   position:fixed;color:#ff3333;font-size:55px;font-weight:900;
   text-shadow:0 0 15px rgba(255,255,255,0.9), 2px 2px 4px #000;
   pointer-events:none;z-index:20001;animation:popUpMedium 1.2s forwards;
 }
 .heal-pop{
   position:fixed;color:#38ef7d;font-size:55px;font-weight:900;
   text-shadow:0 0 15px rgba(255,255,255,0.9), 2px 2px 4px #000;
   pointer-events:none;z-index:20001;animation:popUpMedium 1.2s forwards;
 }
 @keyframes popUpMedium{
   0%{transform:scale(0.6);opacity:0}
   20%{transform:translateY(-15px) scale(1.15);opacity:1}
   75%{transform:translateY(-30px) scale(1.0);opacity:1}
   100%{transform:translateY(-80px) scale(0.85);opacity:0}
 }
 .close-btn{position:absolute;top:10px;right:15px;font-size:24px;cursor:pointer;color:#000;font-weight:bold;}

 .coin-container{perspective:1000px;margin:20px auto;width:150px;height:150px;cursor:pointer;}
 .coin{width:100%;height:100%;position:relative;transform-style:preserve-3d; transition: transform 2s cubic-bezier(0.2, 0.8, 0.3, 1);}
 .coin-face{position:absolute;width:100%;height:100%;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:bold;box-shadow:0 0 20px rgba(0,0,0,.6); border:6px solid #333;}
 .coin-heads{background:linear-gradient(to bottom,#f44336 50%,#fff 50%);}
 .coin-heads::after{content:'';position:absolute;width:100%;height:8px;background:#333;top:50%;transform:translateY(-50%)}
 .coin-heads::before{content:'';position:absolute;width:36px;height:36px;background:#fff;border:6px solid #333;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2}
 .coin-tails{background:#333;color:#fff;transform:rotateY(180deg);border-color:#888;}

 .roulette-power-modal { width: 380px; height: 380px; border-radius: 50%; background: linear-gradient(to bottom, #e3350d 0%, #e3350d 48%, #111 48%, #111 52%, #f5f5f5 52%, #f5f5f5 100%); box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset -10px -20px 40px rgba(0,0,0,0.3), inset 10px 20px 40px rgba(255,255,255,0.4); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #111; }
 .roulette-power-center { width: 170px; height: 170px; background: #2a2a2a; border-radius: 50%; border: 12px solid #1a1a1a; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.9); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; }
 .roulette-power-display { font-size: 65px; font-weight: 900; color: #ffcb05; text-shadow: 0 0 20px #ffcb05, 0 0 40px #ff8c00; }
 .roulette-power-btn { position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, #ffe066 0%, #ffcb05 100%); border: 2px solid #cc9900; color: #222; font-size: 24px; font-weight: 900; padding: 10px 30px; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.8); cursor: pointer; z-index: 3; transition: 0.2s; display: flex; align-items: center; gap: 8px; width: max-content; }
 .roulette-power-btn:hover { transform: translateX(-50%) scale(1.05); filter: brightness(1.1); }
 .roulette-power-btn:disabled { filter: grayscale(100%); cursor: not-allowed; transform: translateX(-50%); }
 .roulette-power-btn-icon { width: 16px; height: 16px; background: #e53935; border-radius: 4px; border: 1px solid #fff; }

 .roulette-item-modal { width: 420px; height: 320px; border-radius: 25px; background: linear-gradient(to bottom, #e3350d 0%, #e3350d 48%, #111 48%, #111 52%, #f5f5f5 52%, #f5f5f5 100%); box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.3); position: relative; display: flex; flex-direction: column; align-items: center; border: 3px solid #111; padding: 15px 20px; box-sizing: border-box; }
 .roulette-item-header { width: 100%; display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 10px; }
 .roulette-item-light { width: 20px; height: 20px; border-radius: 50%; background: #d32f2f; box-shadow: inset -3px -3px 5px rgba(0,0,0,0.5), inset 3px 3px 5px rgba(255,255,255,0.5), 0 0 10px rgba(255,0,0,0.8); border: 2px solid #111; }
 .roulette-item-title { font-size: 28px; font-weight: 900; color: #fff; text-shadow: 2px 2px 0 #333, -1px -1px 0 #333, 1px -1px 0 #333, -1px 1px 0 #333, 0 4px 5px rgba(0,0,0,0.8); letter-spacing: 2px; }

 /* 🎬 進化專屬全螢幕特寫 (Cut-in) */

<script type="module">
 import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
 import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

 const firebaseConfig = {
 apiKey: "AIzaSyBHI3N7AJZIQiG-an7TG92tw7hJZgM640g",
 authDomain: "pokemon-card-game-9e185.firebaseapp.com",
 projectId: "pokemon-card-game-9e185",
 storageBucket: "pokemon-card-game-9e185.firebasestorage.app",
 messagingSenderId: "203475229504",
 appId: "1:203475229504:web:a090439704d6631bc578a5"
 };

 const app = initializeApp(firebaseConfig);
 const db = getFirestore(app);

 window.state = {
 quizMode: 'manual', questions: [], csvQuestions: [], qIdx: 0, currentTeam: 1, step: 'quiz', selectedHandItem: null, hasAttachedEnergyThisTurn: false,
 pendingAttack: null, pendingCatcherTarget: null, eotFlips: [], coinFlipReason: '', coinFlipsQueue: 0, coinFlipsResults: 0, transformingPokemon: null, isAttacking: false, redrawsLeft: 5, nextTurnTeam: null,
 teams: { 1: { pokemon: [], activeIdx: 0, hand: [], lostLives: 0, wrongAnswers: [], usedDynamax: false, usedMega: false }, 2: { pokemon: [], activeIdx: 0, hand: [], lostLives: 0, wrongAnswers: [], usedDynamax: false, usedMega: false } },
 coinStreak: { result: null, count: 0 },
 rouletteState: { type: null, targetIdx: null, interval: null, currentVal: null, pool: [] }
 };

 window.getPokemonSpriteUrl = function(id) {
   return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/${id}.gif`;
 };

 window.getPokemonFallbackUrl = function(id) {
   return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
 };

 document.addEventListener('DOMContentLoaded', () => {
 let id1 = Math.floor(Math.random() * 898) + 1;
 let id2 = Math.floor(Math.random() * 898) + 1;
 while(id1 === id2) id2 = Math.floor(Math.random() * 898) + 1;
 const mLeft = document.querySelector('.mascot-left');
 const mRight = document.querySelector('.mascot-right');
 if(mLeft) mLeft.src = window.getPokemonFallbackUrl(id1);
 if(mRight) mRight.src = window.getPokemonFallbackUrl(id2);
 });

 window.uploadDataToFirestore = async function() {
 if (typeof POKEMON_DB === 'undefined') return window.showAlert("找不到 data.js，請確認檔案位置！");
 window.showConfirm("確定要將本地 data.js 的資料同步至 Firebase 雲端嗎？", async () => {
 try {
 window.addLog("⏳ 正在同步角色資料...");
 for (const p of POKEMON_DB) { 
if (p === null || typeof p !== 'object') continue;
 if (p.id === undefined || p.id === null || p.id === "") throw new Error(`發現一隻寶可夢沒有設定 id！寶可夢名稱為：「${p.name || '未命名'}」`);
 await setDoc(doc(db, "pokemons", p.id.toString()), p); 
}
 for (const t of TRAINERS_DB) { 
if (t === null || typeof t !== 'object') continue;
 if (t.id === undefined || t.id === null || t.id === "") throw new Error(`發現一個道具沒有設定 id！道具名稱為：「${t.name || '未命名'}」`);
 await setDoc(doc(db, "trainers", t.id.toString()), t); 
}
 window.showAlert("✅ 同步成功！角色與道具已上傳至雲端。"); window.addLog("✅ 雲端資料庫已更新。");
 } catch (e) { window.showAlert("❌ 同步失敗: " + e.message); }
 });
 };

 window.initGame = async function() {
 if (window.state.quizMode === 'manual' && window.state.questions.length === 0) {
 const input = document.getElementById('qInput').value.trim();
 if(!input) return window.showAlert("請輸入手動題目，或讀取 CSV 題庫！");
 window.state.questions = input.split('/').map(s => s.trim()).filter(s => s);
 }

 if (document.getElementById('shuffle-questions') && document.getElementById('shuffle-questions').checked) {
 if (window.state.quizMode === 'csv' && window.state.csvQuestions.length > 0) {
 window.state.csvQuestions.sort(() => Math.random() - 0.5);
 } else if (window.state.questions.length > 0) {
 window.state.questions.sort(() => Math.random() - 0.5);
 }
 }

 try {
 window.addLog("🌐 正在從雲端抓取角色資料...");
 const querySnapshot = await getDocs(collection(db, "pokemons"));
 let cloudPokemonDB = [];
 querySnapshot.forEach((doc) => { cloudPokemonDB.push(doc.data()); });

 const trainerSnapshot = await getDocs(collection(db, "trainers"));
 let cloudTrainerDB = [];
 trainerSnapshot.forEach((doc) => { cloudTrainerDB.push(doc.data()); });

 if (cloudPokemonDB.length === 0) {
 cloudPokemonDB = typeof POKEMON_DB !== 'undefined' ? POKEMON_DB : [];
 cloudTrainerDB = typeof TRAINERS_DB !== 'undefined' ? TRAINERS_DB : [];
 }

 window.CLOUD_POKEMON_DB = cloudPokemonDB;
 window.CLOUD_TRAINERS_DB = cloudTrainerDB;

 window.state.redrawsLeft = 5; let isBalanced = false; let attempts = 0;
 while (!isBalanced && attempts < 100) {
 for(let t=1; t<=2; t++) {
 const pool = [...cloudPokemonDB].filter(p => !p.name.includes('超級') && !p.name.includes('超極巨') && !p.name.includes('極巨化')).sort(() => Math.random() - 0.5);
 window.state.teams[t].pokemon = pool.slice(0, 5).map((p, i) => ({
 ...p, currHp: p.hp, attachedEnergy: [], uid: `t${t}_${i}`,
 status: { poison: false, paralyze: false, burn: false, asleep: false, confused: false, immune_next: false, reduce_dmg_20: false, reduce_dmg_30: false, reduce_dmg_50: false, cant_attack: 0, enemy_dmg_minus_30: 0, pending_buff_dmg: 0 },
 buff: { dmg: 0, turns: 0, hasFocusSash: false, potHelmet: 0, fullFaceGuard: 0 }, isDead: false, hasContributedToLoss: false,
 dynamax: { turns: 0, originalForm: null }, mega: { turns: 0, originalForm: null }, transformState: null
 }));
 window.state.teams[t].hand = []; window.state.teams[t].lostLives = 0; window.state.teams[t].wrongAnswers = [];
 window.state.teams[t].usedDynamax = false; window.state.teams[t].usedMega = false;
 }
 const hp1 = window.state.teams[1].pokemon.reduce((sum, p) => sum + p.hp, 0); const hp2 = window.state.teams[2].pokemon.reduce((sum, p) => sum + p.hp, 0);
 attempts++; if (Math.abs(hp1 - hp2) <= 80 || attempts >= 50) isBalanced = true; 
 }

 document.getElementById('lobby').classList.add('hidden');
 document.getElementById('battle-field').classList.remove('hidden');
 window.updateBattleScale(); 
 window.state.step = 'setup';
 window.addLog(`🎲 連線成功！請決定先攻方。`);
 window.render();
 } catch (e) { window.showAlert("❌ 連線失敗：" + e.message); }
 };

 window.showHeal = function(uid, amount) {
 const target = document.getElementById(uid); if(!target) return;
 const rect = target.getBoundingClientRect();
 const cx = rect.left + rect.width / 2; const cy = rect.top + rect.height / 2;
 
 if (window.FX && window.FX.triggerHeal) {
   window.FX.triggerHeal(uid);
 }

 const pop = document.createElement('div'); pop.className = 'heal-pop'; pop.textContent = `+${amount}`;
 pop.style.left = `${cx - 35}px`; pop.style.top = `${cy - 35}px`;

 window.parseCSVData = function(text) {
 const lines = text.split(/\r\n|\n|\r/); window.state.csvQuestions = [];
 let startIndex = lines[0] && (lines[0].includes('題') || lines[0].includes('答')) ? 1 : 0;
 for(let i = startIndex; i < lines.length; i++) {
 let line = lines[i].trim(); if(!line) continue;
 let cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"(.*)"$/, '$1'));
 if(cols.length >= 4) {
 let ans = parseInt(cols[cols.length - 1]); let opts = cols.slice(2, cols.length - 1).filter(o => o !== "");
 if(!isNaN(ans) && ans >= 1 && ans <= opts.length) { window.state.csvQuestions.push({ id: cols[0], q: cols[1], opts: opts, ans: ans }); }
 }
 }
 if(window.state.csvQuestions.length > 0) window.state.quizMode = 'csv';
 };

 window.fetchCloudCSV = function() {
 let url = document.getElementById('cloud-url').value.trim(); if(!url) return;
 document.getElementById('cloud-status').innerText = "⏳ 解析連結中...";
 const idMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
 if (!idMatch || !idMatch[1]) { document.getElementById('cloud-status').innerText = "❌ 無法解析網址，請確認包含 /d/ 試算表ID"; return; }
 
 const sheetId = idMatch[1]; const callbackName = 'gvizCallback_' + Date.now();
 window[callbackName] = function(data) {
 try {
 window.state.csvQuestions = []; let rows = data.table.rows; let startIdx = 0;
 if(rows.length > 0 && rows[0].c[0] && rows[0].c[0].v && typeof rows[0].c[0].v === 'string') {
 const firstCell = rows[0].c[0].v.toLowerCase();
 if(firstCell.includes('題') || firstCell.includes('question') || firstCell.includes('答') || firstCell.includes('id')) { startIdx = 1; }
 }
 for(let i = startIdx; i < rows.length; i++) {
 let row = rows[i]; if(!row.c || !row.c[0] || row.c[0].v === null || row.c[0].v === undefined) continue;
 let cols = row.c.map(cell => (cell && cell.v !== null && cell.v !== undefined) ? cell.v.toString().trim() : "");
 while(cols.length > 0 && cols[cols.length - 1] === "") { cols.pop(); }
 if(cols.length >= 4) {
 let qId = cols[0], qText = cols[1], ans = parseInt(cols[cols.length - 1]);
 let opts = cols.slice(2, cols.length - 1).filter(o => o !== "");
 if(!isNaN(ans) && ans > 0 && ans <= opts.length) { window.state.csvQuestions.push({ id: qId, q: qText, opts: opts, ans: ans }); }
 }
 }
 if (window.state.csvQuestions.length > 0) {
 window.state.quizMode = 'csv'; document.getElementById('cloud-status').innerText = `✅ 連線成功！讀取到 ${window.state.csvQuestions.length} 題。`;
 } else throw new Error("No valid data");
 } catch (e) { document.getElementById('cloud-status').innerText = "❌ 解析失敗。請確認格式（第1欄:題號, 第2欄:題目, 中間:選項, 最後1欄:解答數字）。"; }
 delete window[callbackName]; document.getElementById(callbackName).remove();
 };
 const script = document.createElement('script'); script.id = callbackName;
 script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${callbackName}`;
 script.onerror = function() { document.getElementById('cloud-status').innerText = "❌ 連線失敗。請確認試算表「共用」設定。"; delete window[callbackName]; script.remove(); };
 document.body.appendChild(script);
 };

 window.checkAnswer = function(correct) {
 const currentQIdx = window.state.qIdx; document.getElementById('quiz-modal').style.display = 'none'; window.state.qIdx++;

 if(correct) {
 window.state.step = 'action'; window.state.hasAttachedEnergyThisTurn = false; window.state.isAttacking = false;
 const myTeam = window.state.teams[window.state.currentTeam]; const givenEnergy = window.getSmartEnergyType(myTeam);
 if (myTeam.hand.length < 7) { myTeam.hand.push({ cardType: 'energy', type: givenEnergy }); window.addLog(`✅ 答對！獲得 [${window.getTypeName(givenEnergy)}] 能量。`); } else { window.addLog(`✅ 答對！(手牌已滿)`); }
 
 const tDB = window.CLOUD_TRAINERS_DB || (typeof TRAINERS_DB !== 'undefined' ? TRAINERS_DB : []);
 const trainerChance = window.getTrainerDrawChance(myTeam);

 if(Math.random() < trainerChance && myTeam.hand.length < 7 && tDB.length > 0) { 
 const trainer = tDB[Math.floor(Math.random() * tDB.length)]; 
 myTeam.hand.push({ cardType: 'trainer', ...trainer }); 
 window.addLog(`🎁 獲得道具：「${trainer.name}」！`); 
 }
 window.updateHint("請點擊手牌使用，或點擊招式攻擊 (攻擊後將自動結束回合)。\n🔍 點選左上角放大鏡可查看詳細狀態。");
 } else {
 const myTeam = window.state.teams[window.state.currentTeam];
 let qIdStr = window.state.quizMode === 'csv' ? window.state.csvQuestions[currentQIdx % window.state.csvQuestions.length].id.toString() : `${(currentQIdx % window.state.questions.length) + 1}`;
 myTeam.wrongAnswers.push(qIdStr);
 window.addLog(`❌ 答錯了，回合結束。`); setTimeout(window.processEndOfTurn, 1000);
 }
 window.render();
 };

 window.selectHandCard = function(idx) {
 if(window.state.step !== 'action' || window.state.isAttacking) return;
 const myTeam = window.state.teams[window.state.currentTeam]; const card = myTeam.hand[idx];
 
 if (window.state.selectedHandItem && window.state.selectedHandItem.data.id === 'lucky_recycler') {
 if (idx === window.state.selectedHandItem.index) {
 window.state.selectedHandItem = null;
 window.updateHint("已取消選取。");
 window.render();
 return;
 }
 window.showConfirm(`要獻祭「${card.name || window.getTypeName(card.type)+'能量'}」來發動幸運回收機嗎？`, () => {
   myTeam.hand.splice(idx, 1);
   const recyclerIdx = myTeam.hand.findIndex(c => c.id === 'lucky_recycler');
   if (recyclerIdx !== -1) myTeam.hand.splice(recyclerIdx, 1);
   window.state.selectedHandItem = null;
   window.startRoulette('item', null);
 });
 return;
 }

 if(window.state.selectedHandItem && window.state.selectedHandItem.index === idx) { window.state.selectedHandItem = null; window.updateHint("已取消選取。"); } 
 else {
 window.state.selectedHandItem = { index: idx, data: card };
 if(card.cardType === 'energy') { if(window.state.hasAttachedEnergyThisTurn) return window.showAlert("每回合限附著 1 張能量！"); window.updateHint("請點擊場上任一寶可夢來附著能量。"); } 
 else if (card.cardType === 'trainer') {
 if(card.id === 'lucky_recycler') {
 if (myTeam.hand.length < 2) {
 window.state.selectedHandItem = null;
 return window.showAlert("需要有至少另一張手牌作為代價才能發動「幸運回收機」！");
 }
 window.updateHint("請點擊手牌中另一張要獻祭棄置的廢卡/能量。");
 }
 else if(card.target === 'none' || card.id === 'energy_search' || card.id === 'prof_research') {
 window.useTrainerCard(null, null);
 }
 else if(card.id === 'power_roulette') window.updateHint(`請點擊我方戰鬥寶可夢。`);
 else if(card.id === 'dynamax_band') window.updateHint(`請點擊我方超極巨化潛力寶可夢。`);

 else if(card.target === 'bench') window.updateHint(`請點擊我方後備區。`); 
 else if(card.target === 'dead_ally') window.updateHint(`請點擊陣亡寶可夢復活。`); 
 else if(card.target === 'enemy_bench') window.updateHint(`請點擊對手後備區。`);
 }
 }
 window.render();
 };

 window.retreatToBench = function(team, newIdx) {
 const oldActive = team.pokemon[team.activeIdx];
 if(oldActive.currHp > 0) {
 oldActive.status = { poison: false, paralyze: false, burn: false, asleep: false, confused: false, immune_next: false, reduce_dmg_20: false, reduce_dmg_30: false, reduce_dmg_50: false, cant_attack: 0, enemy_dmg_minus_30: 0, pending_buff_dmg: 0 };
 
 if (window.FX && window.FX.clearStatusFX) {
   window.FX.clearStatusFX(oldActive.uid);
 }

 if (oldActive.transformState) {
 if (oldActive.transformState.originalForm.name === '夢幻') {
 oldActive.currHp = Math.min(oldActive.hp, oldActive.currHp + 60);
 window.addLog(`✨ 夢幻特權！退回後備休養，HP +60！`);
 }
 let hpPercent = oldActive.currHp / oldActive.hp;
 Object.assign(oldActive, oldActive.transformState.originalForm);
 oldActive.attachedEnergy = [...oldActive.transformState.originalEnergy];
 oldActive.currHp = Math.max(10, Math.round(oldActive.hp * hpPercent));
 oldActive.transformState = null;
 window.addLog(`✨ 退回後備，變身解除，恢復原狀！`);
 }

 if (oldActive.mega && oldActive.mega.originalForm) {
 let damageTaken = oldActive.hp - oldActive.currHp;
 Object.assign(oldActive, oldActive.mega.originalForm); 
 oldActive.currHp = Math.max(0, oldActive.hp - damageTaken); 
 oldActive.mega.originalForm = null; oldActive.mega.turns = 0;
 window.addLog(`✨ 退回後備，超級進化解除！`);
 }
 if (oldActive.dynamax && oldActive.dynamax.originalForm) {
 let damageTaken = oldActive.hp - oldActive.currHp;
 Object.assign(oldActive, oldActive.dynamax.originalForm); 
 oldActive.currHp = Math.max(0, oldActive.hp - damageTaken); 
 oldActive.dynamax.originalForm = null; oldActive.dynamax.turns = 0;
 window.addLog(`✨ 退回後備，超極巨化解除！`);
 }
 } else { 
 if (oldActive.transformState) { Object.assign(oldActive, oldActive.transformState.originalForm); oldActive.transformState = null; }
 if (oldActive.mega && oldActive.mega.originalForm) { Object.assign(oldActive, oldActive.mega.originalForm); oldActive.mega.originalForm = null; oldActive.mega.turns = 0; } 
 if (oldActive.dynamax && oldActive.dynamax.originalForm) { Object.assign(oldActive, oldActive.dynamax.originalForm); oldActive.dynamax.originalForm = null; oldActive.dynamax.turns = 0; }
 }
 team.activeIdx = newIdx;
 };

 window.clickPokemon = function(teamNum, pIdx) {
 if(window.state.isAttacking) return;
 const team = window.state.teams[teamNum]; const p = team.pokemon[pIdx];

 if (p.currHp <= 0) { let isReviving = window.state.selectedHandItem && window.state.selectedHandItem.data.target === 'dead_ally' && teamNum === window.state.currentTeam; if (!isReviving) return; }
 if(window.state.step === 'must_swap' && teamNum === window.state.currentTeam && pIdx !== team.activeIdx && p.currHp > 0) {
 team.pokemon[team.activeIdx].status = { poison: false, paralyze: false, burn: false, asleep: false, confused: false, immune_next: false, reduce_dmg_20: false, reduce_dmg_30: false, reduce_dmg_50: false, cant_attack: 0, enemy_dmg_minus_30: 0, pending_buff_dmg: 0 };
 if (window.FX && window.FX.clearStatusFX) {
   window.FX.clearStatusFX(team.pokemon[team.activeIdx].uid);
 }
 if(team.pokemon[team.activeIdx].mega && team.pokemon[team.activeIdx].mega.originalForm) { Object.assign(team.pokemon[team.activeIdx], team.pokemon[team.activeIdx].mega.originalForm); team.pokemon[team.activeIdx].currHp = 0; team.pokemon[team.activeIdx].mega.originalForm = null; }
 if(team.pokemon[team.activeIdx].dynamax && team.pokemon[team.activeIdx].dynamax.originalForm) { Object.assign(team.pokemon[team.activeIdx], team.pokemon[team.activeIdx].dynamax.originalForm); team.pokemon[team.activeIdx].currHp = 0; team.pokemon[team.activeIdx].dynamax.originalForm = null; }
 team.activeIdx = pIdx; window.addLog(`🔄 ${p.name} 上場！`); if (window.state.nextTurnTeam) { window.checkEotSwaps(); } else { window.state.step = 'quiz'; window.startQuiz(); } return;
 }

 if (window.state.step === 'select_enemy_any_snipe') {
 if (teamNum !== window.state.currentTeam && p.currHp > 0) {
   const { attacker, atk, atkIdx } = window.state.pendingAttack;
   let dmg = atk.d;
   p.currHp = Math.max(0, p.currHp - dmg);

   // 🌟 1. 修正：只有在真正處於超極巨化或超級進化狀態下才觸發 isUltra
   const isUltimate = (atkIdx === 1);
   const isUltra = isUltimate && (
     (attacker.dynamax && attacker.dynamax.turns > 0) ||
     (attacker.mega && attacker.mega.turns > 0)
   );

   window.FX.castSkill({
     attackerUid: attacker.uid,
     defenderUid: p.uid,
     element: attacker.type,
     isUltimate: isUltimate,
     isUltra: isUltra,
     damage: dmg,
     onHit: () => {
       window.showDamage(p.uid, dmg);
     }
   });

   window.addLog(`🎯 狙擊成功！對 ${p.name} 造成 ${dmg} 傷害。`);
   if (p.currHp <= 0) { p.isDead = true; window.state.teams[teamNum].lostLives++; window.addLog(`💀 ${p.name} 氣絕！`); }
   window.state.step = 'finished'; window.state.pendingAttack = null; window.render();
   if(window.checkGameOver()) return;
   setTimeout(window.processEndOfTurn, isUltimate ? 1500 : 1000);
 } else { window.showAlert("請選擇對手的寶可夢！"); }
 return;
 }
 
 if (window.state.step === 'select_ally_heal_50' || window.state.step === 'select_ally_heal_70') {
 if (teamNum === window.state.currentTeam && p.currHp > 0) {
 let healAmount = window.state.step === 'select_ally_heal_50' ? 50 : 70;
 let oldHp = p.currHp;
 p.currHp = Math.min(p.hp, p.currHp + healAmount);
 if(p.currHp > oldHp) window.showHeal(p.uid, p.currHp - oldHp);
 window.addLog(`💚 恢復了 ${p.name} ${p.currHp - oldHp} 點生命值！`);
 window.state.step = 'finished'; window.state.pendingAttack = null; window.render();
 setTimeout(window.processEndOfTurn, 1500);
 } else { window.showAlert("請選擇我方沒死的寶可夢！"); }
 return;
 }

 if (window.state.step === 'select_enemy_bench') {
 if (teamNum !== window.state.currentTeam && pIdx !== window.state.teams[teamNum].activeIdx && p.currHp > 0) { window.retreatToBench(window.state.teams[teamNum], pIdx); window.addLog(`💨 強制將 ${p.name} 拖入戰場！`); window.state.step = 'finished'; window.render(); setTimeout(window.processEndOfTurn, 1500); } 
 else { window.showAlert("請選擇對手後備區寶可夢！"); } return;
 }
 if (window.state.step === 'select_transform_target') {
 if (teamNum !== window.state.currentTeam && p.currHp > 0) {
 const attacker = window.state.transformingPokemon;
 let hpPercent = attacker.currHp / attacker.hp;
 attacker.transformState = { 
 originalForm: { name: attacker.name, hp: attacker.hp, type: attacker.type, attacks: JSON.parse(JSON.stringify(attacker.attacks)), weakness: attacker.weakness, resistance: attacker.resistance, id: attacker.id },
 originalEnergy: [...attacker.attachedEnergy]
 };
 
 attacker.name = p.name; attacker.hp = p.hp; attacker.type = p.type; attacker.attacks = p.attacks; attacker.weakness = p.weakness; attacker.resistance = p.resistance; attacker.id = p.id; 
 attacker.attachedEnergy = [...p.attachedEnergy];
 attacker.currHp = Math.max(10, Math.round(attacker.hp * hpPercent));
 
 window.addLog(`✨ ${attacker.transformState.originalForm.name} 變身成了 ${p.name}！(血量等比例轉換)`); 
 window.state.transformingPokemon = null; 
 window.state.step = 'finished'; 
 window.render(); 
 setTimeout(window.processEndOfTurn, 1500);
 } else { window.showAlert("請選擇對手寶可夢！"); } return;
 }

 if(window.state.step !== 'action') return;

 if(window.state.selectedHandItem) {
 const card = window.state.selectedHandItem.data; let valid = false;
 if(card.cardType === 'energy' && teamNum === window.state.currentTeam && p.currHp > 0) valid = true;
 if(card.target === 'ally' && teamNum === window.state.currentTeam && p.currHp > 0) valid = true;
 if(card.target === 'active_ally' && teamNum === window.state.currentTeam && pIdx === team.activeIdx && p.currHp > 0) valid = true;
 if(card.target === 'bench' && teamNum === window.state.currentTeam && pIdx !== team.activeIdx && p.currHp > 0) valid = true;
 if(card.target === 'dead_ally' && teamNum === window.state.currentTeam && p.currHp <= 0) valid = true;
 if(card.target === 'enemy_bench' && teamNum !== window.state.currentTeam && pIdx !== window.state.teams[teamNum].activeIdx && p.currHp > 0) valid = true;
 
 if(card.id === 'power_roulette') {
 if (teamNum === window.state.currentTeam && pIdx === team.activeIdx && p.currHp > 0) valid = true;
 } else if(card.id === 'dynamax_band') {
 if(window.state.teams[window.state.currentTeam].usedDynamax) { window.showAlert("極巨腕帶一場比賽只能使用一次！"); return; }
 if (teamNum === window.state.currentTeam && p.currHp > 0 && p.gmaxId) valid = true; else { if(teamNum === window.state.currentTeam && p.currHp > 0) window.showAlert("這隻寶可夢沒有超極巨化潛力！"); return; }
 } else if (card.id === 'mega_stone') {
 if(window.state.teams[window.state.currentTeam].usedMega) { window.showAlert("超級進化石一場比賽只能使用一次！"); return; }
 if (teamNum === window.state.currentTeam && p.currHp > 0 && p.megaId) valid = true; else { if(teamNum === window.state.currentTeam && p.currHp > 0) window.showAlert("這隻寶可夢無法超級進化！"); return; }
 }
 
 if(!valid) return;

 if (card.id === 'pot_helmet' && p.hp >= 100) { return window.showAlert("「鍋型頭盔」僅限最大 HP 小於 100 的寶可夢裝備！"); }
 if (card.id === 'focus_sash' && p.hp > 120) { return window.showAlert("「氣勢披帶」僅限最大 HP 為 120 (含)以下的寶可夢裝備！"); }

 if(card.cardType === 'energy') {
 p.attachedEnergy.push(card.type); window.state.teams[window.state.currentTeam].hand.splice(window.state.selectedHandItem.index, 1); window.state.hasAttachedEnergyThisTurn = true;
 window.addLog(`⚡ 為 ${p.name} 附著了能量。`); window.state.selectedHandItem = null; window.updateHint("附著完畢，請選擇攻擊。"); window.render();
 } else if(card.cardType === 'trainer') { window.useTrainerCard(teamNum, pIdx); }
 return;
 }

 if(!window.state.selectedHandItem && teamNum === window.state.currentTeam && pIdx !== team.activeIdx && p.currHp > 0) {
 const activeP = team.pokemon[team.activeIdx];
 if(activeP.attachedEnergy.length < 1) { return window.showAlert(`需要消耗 1 能量才能撤退！`); }
 window.showConfirm(`要消耗 1 能量將 ${activeP.name} 撤退，換 ${p.name} 上場嗎？`, () => { activeP.attachedEnergy.pop(); window.retreatToBench(team, pIdx); window.addLog(`🏃 ${activeP.name} 消耗能量撤退！`); window.render(); }); return;
 }
 };

 window.startRoulette = function(type, targetIdx) {
 window.state.rouletteState.type = type;
 window.state.rouletteState.targetIdx = targetIdx;
 
 const powerUI = document.getElementById('roulette-power-ui');
 const itemUI = document.getElementById('roulette-item-ui');
 const btnPower = document.getElementById('roulette-stop-btn-power');
 const btnItem = document.getElementById('roulette-stop-btn-item');

 let display;

 if(type === 'power') {
 powerUI.classList.remove('hidden');
 itemUI.classList.add('hidden');
 btnPower.disabled = false;
 display = document.getElementById('roulette-display-power');
 window.state.rouletteState.pool = [5, 10, 15, 20, 30];
 } else if(type === 'item') {
 powerUI.classList.add('hidden');
 itemUI.classList.remove('hidden');
 btnItem.disabled = false;
 display = document.getElementById('roulette-display-item');
 window.state.rouletteState.pool = ["potion", "super_potion", "full_heal", "switch", "energy_search", "pokemon_catcher", "rescue_stretcher", "boss_orders", "prof_research", "muscle_band", "focus_sash", "full_face_guard", "pot_helmet", "mystery_swap", "dynamax_band", "mega_stone"];
 }

 document.getElementById('roulette-modal').style.display = 'flex';

 window.state.rouletteState.interval = setInterval(() => {
 const pool = window.state.rouletteState.pool;
 const rand = pool[Math.floor(Math.random() * pool.length)];
 window.state.rouletteState.currentVal = rand;
 
 if (type === 'power') {
 display.textContent = `+${rand}`;
 } else {
 const tDB = window.CLOUD_TRAINERS_DB || (typeof TRAINERS_DB !== 'undefined' ? TRAINERS_DB : []);
 const item = tDB.find(t => t.id === rand);
 display.innerHTML = item ? `<div style="font-size:30px; margin-bottom:5px;">${item.icon}</div><div style="font-size:24px; color:#fff; text-shadow:none; letter-spacing:1px;">${item.name}</div>` : rand;
 }
 }, 80);
 };

 window.stopRoulette = function() {
 const btnPower = document.getElementById('roulette-stop-btn-power');
 const btnItem = document.getElementById('roulette-stop-btn-item');
 btnPower.disabled = true;
 btnItem.disabled = true;
 
 clearInterval(window.state.rouletteState.interval);
 const type = window.state.rouletteState.type;
 const result = window.state.rouletteState.currentVal;
 const myTeam = window.state.teams[window.state.currentTeam];

 setTimeout(() => {
 document.getElementById('roulette-modal').style.display = 'none';
 if (type === 'power') {
 const p = myTeam.pokemon[window.state.rouletteState.targetIdx];
 p.buff.dmg += result;
 p.buff.turns = 1;
 if (window.FX && window.FX.triggerBuff) {
   window.FX.triggerBuff(p.uid);
 }
 window.addLog(`🎡 力量輪盤爆發！${p.name} 本回合攻擊力 +${result}！`);
 
 if (window.state.selectedHandItem) {
   myTeam.hand.splice(window.state.selectedHandItem.index, 1);
 }
 } else if (type === 'item') {
 const tDB = window.CLOUD_TRAINERS_DB || (typeof TRAINERS_DB !== 'undefined' ? TRAINERS_DB : []);
 const item = tDB.find(t => t.id === result);
 if (item && myTeam.hand.length < 7) {
   myTeam.hand.push({ cardType: 'trainer', ...item });
   window.addLog(`🎰 幸運回收機轉出大獎：「${item.name}」！`);
 }
 }
 window.state.selectedHandItem = null;
 window.updateHint("道具使用完畢。");
 window.render();
 }, 1200); 
 };

 window.useTrainerCard = function(teamNum, targetIdx) {
 const myTeam = window.state.teams[window.state.currentTeam]; const card = window.state.selectedHandItem.data; let consumed = true;
 
 if(card.id === 'power_roulette') {
 window.startRoulette('power', targetIdx); return;
 } else if(card.id === 'mystery_swap') {
 const currentIds = [...window.state.teams[1].pokemon, ...window.state.teams[2].pokemon].map(p => p.id);
 const candidates = window.CLOUD_POKEMON_DB.filter(p => !currentIds.includes(p.id) && !p.name.includes('超級') && !p.name.includes('超極巨') && !p.name.includes('極巨化'));
 if(candidates.length === 0) return window.showAlert("目前沒有多餘的寶可夢可替換！");
 const newP = candidates[Math.floor(Math.random() * candidates.length)];
 const oldP = myTeam.pokemon[targetIdx];
 myTeam.pokemon[targetIdx] = {
 ...newP, currHp: newP.hp, attachedEnergy: [], uid: oldP.uid,
 status: { poison: false, paralyze: false, burn: false, asleep: false, confused: false, immune_next: false, reduce_dmg_20: false, reduce_dmg_30: false, reduce_dmg_50: false, cant_attack: 0, enemy_dmg_minus_30: 0, pending_buff_dmg: 0 },
 buff: { dmg: 0, turns: 0, hasFocusSash: false, potHelmet: 0, fullFaceGuard: 0 }, isDead: false, dynamax: { turns: 0, originalForm: null }, mega: { turns: 0, originalForm: null }, transformState: null
 };
 window.addLog(`🎲 神秘置換！${oldP.name} 換成了 ${newP.name}！`);
 } else if(card.id === 'pokemon_catcher') {
 window.state.pendingCatcherTarget = targetIdx; window.state.coinFlipReason = 'catcher';
 document.getElementById('coin-desc').innerHTML = `請擲硬幣：<br>正面則強制對手替換。`;
 const coinInner = document.getElementById('coin-inner'); if(coinInner) { coinInner.style.transition = 'none'; coinInner.style.transform = 'rotateY(0deg)'; }
 document.getElementById('coin-modal').style.display = 'flex'; return; 
 } else if(card.id === 'potion' || card.id === 'super_potion') {
 const p = myTeam.pokemon[targetIdx]; if(p.currHp === p.hp) return window.showAlert("HP 已滿！");
 const heal = card.id === 'potion' ? 30 : 50; 
 let oldHp = p.currHp;
 p.currHp = Math.min(p.hp, p.currHp + heal);

 let dmg = atk.d; let log = { text: `⚔️ ${attacker.name} 使用了「${atk.n}」！` };

 if (atk.special && window.AttackEffects && window.AttackEffects[atk.special]) {

 if (atk.special === 'force_swap_choose') { const aliveBench = window.state.teams[enemyTeamNum].pokemon.filter((p, i) => i !== window.state.teams[enemyTeamNum].activeIdx && p.currHp > 0); if(aliveBench.length > 0) { window.state.step = 'select_enemy_bench'; window.state.pendingAttack = null; window.state.isAttacking = false; window.updateHint("請選擇對手後備寶可夢拖上場！"); window.render(); return; } else { log.text += ` (對手無後備，替換無效)`; } }
 if (atk.special === 'transform_choose') { window.state.step = 'select_transform_target'; window.state.transformingPokemon = attacker; window.state.pendingAttack = null; window.state.isAttacking = false; window.updateHint("請選擇對手進行複製！"); window.render(); return; }
 if(atk.special.includes('flip_') && atk.special.includes('x')) { dmg = coinResult * parseInt(atk.special.split('x')[1]); log.text += ` (擲出 ${coinResult} 次正面，造成 ${dmg} 傷害！)`; }

 if(atk.special === 'plus_dmg_per_water') { let extra = attacker.attachedEnergy.filter(e => e === 'water' || e === 'rainbow').length - 2; if(extra > 0) dmg += Math.min(2, extra) * 10; }
 if (atk.special === 'draw_1') {

 if(Math.random() < window.getTrainerDrawChance(myTeam) && tDB.length > 0) myTeam.hand.push({ cardType: 'trainer', ...tDB[Math.floor(Math.random() * tDB.length)] });
 else myTeam.hand.push({ cardType: 'energy', type: window.getSmartEnergyType(myTeam) });
 log.text += ` (隨機抽 1 卡)`;

 if (atk.special === 'draw_2') {

 <div style="font-size:9px; opacity:0.8; margin-top:auto; display:flex; justify-content:space-between; align-items:center; padding-top:4px;"><div style="display:flex; align-items:center; gap:2px;"><span>弱:</span>${weakIcon}</div><div style="display:flex; align-items:center; gap:2px;"><span>抗:</span>${resIcon}</div></div>`;
 }
 cardHtml += `</div>`;

 if(isActive) actHtml = `<div class="active-zone">${cardHtml}</div>`; else benHtml += cardHtml;
 });
 document.getElementById(`field-${t}`).innerHTML = (t===1) ? `<div class="bench-grid">${benHtml}</div>${actHtml}` : `${actHtml}<div class="bench-grid">${benHtml}</div>`;
 
 const handDiv = document.getElementById(`hand-${t}`); handDiv.innerHTML = '';
 team.hand.forEach((card, cIdx) => {
 const isSelected = (window.state.selectedHandItem && window.state.selectedHandItem.index === cIdx); const descText = card.desc ? card.desc.replace(/'/g, "\\'") : '';
 if(card.cardType === 'energy') {
 handDiv.innerHTML += `<div class="hand-card hand-energy energy-${card.type} ${isSelected ? 'selected' : ''}" onclick="window.selectHandCard(${cIdx})" onmouseenter="window.showHandTooltip(${t}, '💡 提供 1 個 [${window.getTypeName(card.type)}] 能量')" onmouseleave="window.hideHandTooltip(${t})"><div class="energy-icon energy-${card.type}" style="width:25px;height:25px;margin-bottom:5px;"></div><div style="color:white;text-shadow:1px 1px 2px #000;">能量</div></div>`;
 } else {
 handDiv.innerHTML += `<div class="hand-card hand-trainer ${isSelected ? 'selected' : ''}" onclick="window.selectHandCard(${cIdx})" onmouseenter="window.showHandTooltip(${t}, '💡 ${descText}')" onmouseleave="window.hideHandTooltip(${t})"><div style="font-size:24px; margin-bottom:2px;">${card.icon}</div><div style="white-space:nowrap; transform:scale(0.85);">${card.name}</div></div>`;
 }
 });
 };
 drawSide(1); drawSide(2);
 
 const turnInd = document.getElementById('turn-indicator'); const actionHint = document.getElementById('action-hint');
 const setupUI = document.getElementById('setup-ui'); const endBtn = document.getElementById('end-turn-btn');
 if (window.state.step === 'setup') {
 turnInd.style.display = 'none'; actionHint.style.display = 'none'; endBtn.style.display = 'none'; setupUI.style.display = 'flex';
 document.getElementById('btn-redraw').disabled = window.state.redrawsLeft <= 0; document.getElementById('btn-redraw').textContent = `🔄 重抽卡牌 (${window.state.redrawsLeft})`;
 } else {
 setupUI.style.display = 'none'; turnInd.style.display = 'block'; actionHint.style.display = 'block';
 turnInd.textContent = window.state.step === 'must_swap' ? `⚠️ TEAM ${window.state.currentTeam} 必須換人！` : `▶ TEAM ${window.state.currentTeam} 的回合`;
 turnInd.style.color = '#ffcb05'; endBtn.style.display = window.state.step === 'action' ? 'block' : 'none';
 }
 };

 document.addEventListener('mousemove', (e) => {
   const card = e.target.closest('.card');
   if (!card || card.classList.contains('dead')) return;

   const rect = card.getBoundingClientRect();
   const x = e.clientX - rect.left;
   const y = e.clientY - rect.top;

   const centerX = rect.width / 2;
   const centerY = rect.height / 2;

   const rotateX = ((y - centerY) / centerY) * -8;
   const rotateY = ((x - centerX) / centerX) * 8;

   const xPercent = (x / rect.width) * 100;
   const yPercent = (y / rect.height) * 100;

   card.style.setProperty('--mouse-x', `${xPercent.toFixed(1)}%`);
   card.style.setProperty('--mouse-y', `${yPercent.toFixed(1)}%`);
   
   const baseScale = card.classList.contains('card-active') ? 1.05 : 1.0;
   card.style.transform = `perspective(800px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-4px) scale(${baseScale * 1.03})`;
 });

 document.addEventListener('mouseout', (e) => {
   const card = e.target.closest('.card');
   if (card && (!e.relatedTarget || !card.contains(e.relatedTarget))) {
     card.style.transform = '';
     card.style.removeProperty('--mouse-x');
     card.style.removeProperty('--mouse-y');
   }
 });
</script>
</body>
